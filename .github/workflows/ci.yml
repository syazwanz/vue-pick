name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch makes the in-flight run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Cheapest first, so an obvious failure reports in seconds.
      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format:check

      # Catches what ESLint cannot: prop and template types, and test files,
      # which the build does not compile.
      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # Not redundant with the tests: type errors in the SFCs only surface
      # here. A conditional emit name once passed both lint and tests and
      # still failed the build.
      - name: Build
        run: pnpm build
